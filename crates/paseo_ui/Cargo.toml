[package]
name = "paseo_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/paseo_ui.rs"
doctest = false

[features]
test-support = []

[[example]]
name = "sidebar_screenshots"
required-features = ["test-support"]

[dependencies]
